


<!DOCTYPE html>

{% block content %}
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siyah - Kırmızı - Lacivert Navbar</title>
{% endblock %}
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Style Rules -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>




  <style>
     /* Temanın Arka Planı (Sayfadaki uyumu görmek için) */
    body {
      background: linear-gradient(135deg, #0a0a0c 0%, #0d1322 100%);
      min-height: 100vh;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Navbar Özel Stil Sınıfları */
    .custom-navbar {
      background-color: rgba(10, 10, 12, 0.85) !important;
      backdrop-filter: blur(12px); /* Buzlu cam efekti */
      border-bottom: 2px solid #8b0000; /* Alt Kırmızı Vurgu Çizgisi */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      padding: 0.8rem 1rem;
    }

    /* Logo / Brand */
    .navbar-brand {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 0.1rem;
      color: #ffffff !important;
    }
    .navbar-brand span {
      color: #dc3545; /* Kırmızı Dokunuş */
    }

    /* Nav Linkleri */
    .custom-navbar .nav-link {
      color: #cbd5e1 !important;
      font-weight: 500;
      margin: 0 0.3rem;
      padding: 0.5rem 0.8rem;
      position: relative;
      transition: color 0.3s ease;
    }

    /* Hover ve Active Alt Çizgi Efekti */
    .custom-navbar .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 50%;
      background-color: #dc3545; /* Kırmızı Alt Çizgi */
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .custom-navbar .nav-link:hover,
    .custom-navbar .nav-link.active {
      color: #ffffff !important;
    }

    .custom-navbar .nav-link:hover::after,
    .custom-navbar .nav-link.active::after {
      width: 80%;
    }

    /* Dropdown Menü (Lacivert / Siyah Uyumlu) */
    .custom-navbar .dropdown-menu {
      background-color: #0f172a; /* Lacivert Tone */
      border: 1px solid #1e293b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      padding: 0.5rem;
    }

    .custom-navbar .dropdown-item {
      color: #cbd5e1;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .custom-navbar .dropdown-item:hover {
      background-color: #dc3545; /* Hover'da Kırmızı */
      color: #ffffff;
      padding-left: 1.2rem;
    }

    .custom-navbar .dropdown-divider {
      border-top-color: #1e293b;
    }

    /* Eylem Butonu (Giriş Yap / İletişim) */
    .btn-nav-action {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border: 1px solid #dc3545;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.5rem 1.2rem;
      transition: all 0.3s ease;
    }

    .btn-nav-action:hover {
      background: #dc3545;
      color: #ffffff;
      border-color: #dc3545;
      box-shadow: 0 0 15px rgba(220, 53, 69, 0.4);
      transform: translateY(-1px);
    }

    /* Mobil Hamburger Menü İkon Stili */
    .navbar-toggler {
      border: 1px solid #dc3545;
      padding: 0.4rem 0.6rem;
    }
    .navbar-toggler:focus {
      box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
    }
    .navbar-toggler-icon {
      filter: invert(1); /* İkonu beyaz yapar */
    }
  </style>
</head>


<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    (function () {
      let socket = null;
      const reconnectInterval = 3000;
      const statusElement = document.getElementById("connectionStatus");
      const listContainer = document.getElementById("personListContainer");
      const noDataPlaceholder = document.getElementById("noDataPlaceholder");
      const lastUpdatedElement = document.getElementById("lastUpdated");

      function getWebSocketUrl() {
        const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        // routing.py'deki rotaya uygun: /ws/interpol_data_stream/
        return `${protocol}${window.location.host}/ws/interpol_data_stream/`;
      }

      function connectWebSocket() {
        socket = new WebSocket(getWebSocketUrl());

        socket.onopen = function () {
          console.log("[WS] Bağlantı başarıyla açıldı.");
          statusElement.className = "status-badge bg-success text-white";
          statusElement.innerHTML = `<i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Canlı Bağlantı`;
        };

        socket.onmessage = function (event) {
          try {
            const res = JSON.parse(event.data);

            // DTO event akışı kontrolü
            if (res.event_type && res.data) {
              handlePersonEvent(res.event_type, res.data);
            } else if (res.message) {
              console.log("[WS Bilgi Mesajı]:", res.message);
            }
          } catch (err) {
            console.error("[WS] JSON Parse Hatası:", err, event.data);
          }
        };

        socket.onclose = function (e) {
          console.warn("[WS] Bağlantı koptu. Yeniden bağlanıyor...", e.reason);
          statusElement.className = "status-badge bg-danger text-white";
          statusElement.innerHTML = `<i class="bi bi-arrow-clockwise"></i> Yeniden Bağlanıyor`;
          setTimeout(connectWebSocket, reconnectInterval);
        };

        socket.onerror = function (err) {
          console.error("[WS] Bağlantı hatası:", err);
          socket.close();
        };
      }

      function handlePersonEvent(eventType, person) {
        if (noDataPlaceholder) {
          noDataPlaceholder.style.display = "none";
        }

        // Benzersiz ID eşleşmesi
        const personId = person.id || person.entity_id || person.national_id || Math.random().toString(36).substr(2, 9);
        const cardId = `person-card-${personId}`;
        const existingCard = document.getElementById(cardId);

        const now = new Date().toLocaleTimeString();
        const fullName = `${person.forename || person.first_name || ''} ${person.name || person.last_name || ''}`.trim() || "Bilinmiyor";

        lastUpdatedElement.textContent = `Son Olay: ${fullName} (${eventType} - ${now})`;

        if (existingCard) {
          // Mevcut elemanı güncelle
          existingCard.outerHTML = createPersonCardHtml(person, cardId, "highlight-updated");
        } else {
          // Yeni elemanı listenin en başına ekle
          const newCardHtml = createPersonCardHtml(person, cardId, "highlight-new");
          listContainer.insertAdjacentHTML("afterbegin", newCardHtml);
        }
      }

      function createPersonCardHtml(person, elementId, animationClass) {
        const fullName = `${person.forename || person.first_name || ''} ${person.name || person.last_name || ''}`.trim() || "Bilinmiyor";
        const charge = person.charge || person.crime || person.arrest_warrants?.[0]?.charge || "Kırmızı Bülten";
        const nationality = person.nationalities?.[0] || person.nationality || person.country || "Belirtilmemiş";
        const dateOfBirth = person.date_of_birth || person.birth_date || "-";

        return `
          <div class="col-12 col-md-6 col-lg-4" id="${elementId}">
            <div class="person-card p-3 ${animationClass}">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="mb-0 text-white font-weight-bold">${fullName}</h5>
                <span class="badge bg-danger">Aranıyor</span>
              </div>
              <p class="text-secondary small mb-2 text-truncate" title="${charge}">
                <i class="bi bi-exclamation-triangle text-danger me-1"></i> Suç: <span class="text-light">${charge}</span>
              </p>
              <div class="d-flex justify-content-between small text-secondary border-top border-secondary pt-2 mt-2">
                <span><i class="bi bi-geo-alt me-1"></i>${nationality}</span>
                <span>D.Tarihi: ${dateOfBirth}</span>
              </div>
            </div>
          </div>
        `;
      }

      connectWebSocket();
    })();
  </script>
  <!-- NAVBAR BAŞLANGICI -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
    <div class="container">

      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <i class="bi bi-shield-shaded me-2 text-danger"></i><span>Interpol Tarafindan Aranmakta</span>
      </a>



      <!-- Menü İçeriği -->
      <div class="collapse navbar-collapse" id="navbarContent">

        <!-- Sol / Orta Linkler -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Ana Sayfa</a>
          </li>

        </ul>

      </div>


    </div>
  </nav>
  <!-- NAVBAR BİTİŞİ -->

  <!-- Bootstrap 5 JS Bundle (Popper dahil) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
