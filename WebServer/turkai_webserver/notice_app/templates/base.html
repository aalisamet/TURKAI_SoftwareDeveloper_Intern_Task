<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interpol Aranıyor Listesi</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #0a0a0c 0%, #0d1322 100%);
      min-height: 100vh;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-top: 80px; /* Navbar taşmasını önlemek için */
    }

    .custom-navbar {
      background-color: rgba(10, 10, 12, 0.85) !important;
      backdrop-filter: blur(12px);
      border-bottom: 2px solid #8b0000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      padding: 0.8rem 1rem;
    }

    .person-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    
    .person-card:hover {
      border-color: #dc3545;
      transform: translateY(-3px);
    }

    /* Animasyonlar */
    .highlight-new {
      animation: flashNew 1.5s ease-out;
    }
    .highlight-updated {
      animation: flashUpdate 1.5s ease-out;
    }

    @keyframes flashNew {
      0% { border-color: #198754; box-shadow: 0 0 15px rgba(25, 135, 84, 0.6); }
      100% { border-color: #1e293b; }
    }
    @keyframes flashUpdate {
      0% { border-color: #ffc107; box-shadow: 0 0 15px rgba(255, 193, 7, 0.6); }
      100% { border-color: #1e293b; }
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
    <div class="container">
      <a class="navbar-brand text-white fw-bold" href="#">
        <i class="bi bi-shield-shaded me-2 text-danger"></i>Interpol <span class="text-danger">Takip</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span id="lastUpdated" class="text-secondary small"></span>
        <span id="connectionStatus" class="badge bg-warning text-dark">
          <i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Bağlanıyor...
        </span>
      </div>
    </div>
  </nav>

  <!-- KARTLARIN EKLENECEĞİ ANA ALAN -->
  <main class="container my-4">
    <div id="noDataPlaceholder" class="text-center text-secondary py-5">
      <i class="bi bi-inbox fs-1 d-block mb-2"></i>
      Henüz veri akışı yok. Canlı veriler bekleniyor...
    </div>

    <!-- JavaScript buraya kartları dinamik ekler -->
    <div class="row g-4" id="personListContainer"></div>
  </main>

  <!-- JS KODLARI (Sayfanın En Altında) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      let socket = null;
      const WS_PORT = 8080;
      const reconnectInterval = 3000;

      const statusElement = document.getElementById("connectionStatus");
      const listContainer = document.getElementById("personListContainer");
      const noDataPlaceholder = document.getElementById("noDataPlaceholder");
      const lastUpdatedElement = document.getElementById("lastUpdated");

      function getWebSocketUrl() {
        const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        const hostname = window.location.hostname || "localhost";
        return `${protocol}${hostname}:${WS_PORT}`;
      }

      function connectWebSocket() {
        const url = getWebSocketUrl();
        socket = new WebSocket(url);

        socket.onopen = function () {
          if (statusElement) {
            statusElement.className = "badge bg-success text-white";
            statusElement.innerHTML = `<i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Canlı Bağlantı`;
          }
        };

        socket.onmessage = function (event) {
          try {
            let payload = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
            let personData = payload.data ? payload.data : payload;
            let eventType = payload.event_type || (payload.data ? "EVENT" : "UPDATE");

            if (personData) {
              handlePersonEvent(eventType, personData);
            }
          } catch (err) {
            console.error("[WS] Veri işleme hatası:", err, event.data);
          }
        };

        socket.onclose = function (e) {
          if (statusElement) {
            statusElement.className = "badge bg-danger text-white";
            statusElement.innerHTML = `<i class="bi bi-arrow-clockwise"></i> Yeniden Bağlanıyor`;
          }
          setTimeout(connectWebSocket, reconnectInterval);
        };

        socket.onerror = function (err) {
          console.error("[WS] Hata oluştu:", err);
          socket.close();
        };
      }

      function handlePersonEvent(eventType, person) {
        if (noDataPlaceholder) {
          noDataPlaceholder.style.display = "none";
        }

        const personId = person.id || person.entity_id || person.national_id || person.identity_number;
        const cleanId = personId ? String(personId).replace(/[^a-zA-Z0-9-_]/g, '') : Math.random().toString(36).substring(2, 9);
        const cardId = `person-card-${cleanId}`;
        const existingCard = document.getElementById(cardId);

        const now = new Date().toLocaleTimeString();
        const fullName = `${person.forename || person.first_name || ''} ${person.name || person.last_name || ''}`.trim() || "Bilinmeyen Şahıs";

        if (lastUpdatedElement) {
          lastUpdatedElement.textContent = `Son Olay: ${fullName} (${now})`;
        }

        if (existingCard) {
          existingCard.outerHTML = createPersonCardHtml(person, cardId, "highlight-updated");
        } else if (listContainer) {
          const newCardHtml = createPersonCardHtml(person, cardId, "highlight-new");
          listContainer.insertAdjacentHTML("afterbegin", newCardHtml);
        }
      }

      function createPersonCardHtml(person, elementId, animationClass) {
        const fullName = `${person.forename || person.first_name || ''} ${person.name || person.last_name || ''}`.trim() || "Bilinmiyor";
        const charge = person.charge || person.crime || person.arrest_warrants?.[0]?.charge || "Kırmızı Bülten";
        const nationality = person.nationalities?.[0] || person.nationality || person.country || "Belirtilmemiş";
        const dateOfBirth = person.date_of_birth || person.birth_date || "-";

        return `
          <div class="col-12 col-md-6 col-lg-4" id="${elementId}">
            <div class="person-card p-3 ${animationClass}">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="mb-0 text-white fw-bold">${fullName}</h5>
                <span class="badge bg-danger">Aranıyor</span>
              </div>
              <p class="text-secondary small mb-2 text-truncate" title="${charge}">
                <i class="bi bi-exclamation-triangle text-danger me-1"></i> Suç: <span class="text-light">${charge}</span>
              </p>
              <div class="d-flex justify-content-between small text-secondary border-top border-secondary pt-2 mt-2">
                <span><i class="bi bi-geo-alt me-1"></i>${nationality}</span>
                <span>D.Tarihi: ${dateOfBirth}</span>
              </div>
            </div>
          </div>
        `;
      }

      connectWebSocket();
    })();
  </script>
</body>
</html>
