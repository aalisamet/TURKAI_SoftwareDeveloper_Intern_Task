


<!DOCTYPE html>

{% block content %}
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siyah - Kırmızı - Lacivert Navbar</title>
{% endblock %}
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/base.css">
  <!-- Custom Style Rules -->
  <style>
     /* Temanın Arka Planı (Sayfadaki uyumu görmek için) */
    body {
      background: linear-gradient(135deg, #0a0a0c 0%, #0d1322 100%);
      min-height: 100vh;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Navbar Özel Stil Sınıfları */
    .custom-navbar {
      background-color: rgba(10, 10, 12, 0.85) !important;
      backdrop-filter: blur(12px); /* Buzlu cam efekti */
      border-bottom: 2px solid #8b0000; /* Alt Kırmızı Vurgu Çizgisi */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      padding: 0.8rem 1rem;
    }

    /* Logo / Brand */
    .navbar-brand {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 0.1rem;
      color: #ffffff !important;
    }
    .navbar-brand span {
      color: #dc3545; /* Kırmızı Dokunuş */
    }

    /* Nav Linkleri */
    .custom-navbar .nav-link {
      color: #cbd5e1 !important;
      font-weight: 500;
      margin: 0 0.3rem;
      padding: 0.5rem 0.8rem;
      position: relative;
      transition: color 0.3s ease;
    }

    /* Hover ve Active Alt Çizgi Efekti */
    .custom-navbar .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 50%;
      background-color: #dc3545; /* Kırmızı Alt Çizgi */
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .custom-navbar .nav-link:hover,
    .custom-navbar .nav-link.active {
      color: #ffffff !important;
    }

    .custom-navbar .nav-link:hover::after,
    .custom-navbar .nav-link.active::after {
      width: 80%;
    }

    /* Dropdown Menü (Lacivert / Siyah Uyumlu) */
    .custom-navbar .dropdown-menu {
      background-color: #0f172a; /* Lacivert Tone */
      border: 1px solid #1e293b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      padding: 0.5rem;
    }

    .custom-navbar .dropdown-item {
      color: #cbd5e1;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .custom-navbar .dropdown-item:hover {
      background-color: #dc3545; /* Hover'da Kırmızı */
      color: #ffffff;
      padding-left: 1.2rem;
    }

    .custom-navbar .dropdown-divider {
      border-top-color: #1e293b;
    }

    /* Eylem Butonu (Giriş Yap / İletişim) */
    .btn-nav-action {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border: 1px solid #dc3545;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.5rem 1.2rem;
      transition: all 0.3s ease;
    }

    .btn-nav-action:hover {
      background: #dc3545;
      color: #ffffff;
      border-color: #dc3545;
      box-shadow: 0 0 15px rgba(220, 53, 69, 0.4);
      transform: translateY(-1px);
    }

    /* Mobil Hamburger Menü İkon Stili */
    .navbar-toggler {
      border: 1px solid #dc3545;
      padding: 0.4rem 0.6rem;
    }
    .navbar-toggler:focus {
      box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
    }
    .navbar-toggler-icon {
      filter: invert(1); /* İkonu beyaz yapar */
    }
  </style>
</head>


<body>

  <!-- NAVBAR BAŞLANGICI -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
    <div class="container">

      <!-- Logo -->
      <a class="navbar-brand" href="#">
        <i class="bi bi-shield-shaded me-2 text-danger"></i><span>Interpol Tarafindan Aranmakta</span>
      </a>



      <!-- Menü İçeriği -->
      <div class="collapse navbar-collapse" id="navbarContent">

        <!-- Sol / Orta Linkler -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Ana Sayfa</a>
          </li>

        </ul>

      </div>


    </div>
  </nav>
  <!-- NAVBAR BİTİŞİ -->

  <!-- Bootstrap 5 JS Bundle (Popper dahil) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
